<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scooter Steuerung</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #111;
    color: #eee;
    text-align: center;
    padding: 40px 20px;
    margin: 0;
  }
  h1 { font-size: 22px; margin-bottom: 30px; }
  button {
    font-size: 18px;
    padding: 16px 30px;
    border-radius: 12px;
    border: none;
    margin: 10px;
    cursor: pointer;
    width: 80%;
    max-width: 320px;
  }
  #connectBtn { background: #2d7dfd; color: white; }
  #sendBtn { background: #2ecc71; color: white; }
  #status {
    margin-top: 30px;
    padding: 15px;
    background: #222;
    border-radius: 10px;
    font-size: 14px;
    word-break: break-all;
    text-align: left;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

  <h1>🛴 Scooter Steuerung</h1>

  <button id="connectBtn">Mit Scooter verbinden</button>
  <br>
  <button id="sendBtn" disabled>Testbefehl senden</button>

  <div id="status">Noch nicht verbunden.</div>

<script>
  // Diese Werte müssen wir später noch mit nRF Connect herausfinden
  // (Schritt: Anfahrhilfe in der Ninebot-App ändern und schauen, welche
  // Characteristic sich ändert). Bis dahin ist das nur ein Platzhalter.
  const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";        // Nordic UART Service (häufig bei Ninebot)
  const WRITE_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // "TX" Characteristic zum Schreiben

  let device;
  let writeCharacteristic;

  const statusEl = document.getElementById("status");
  const connectBtn = document.getElementById("connectBtn");
  const sendBtn = document.getElementById("sendBtn");

  function log(text) {
    statusEl.textContent += "\n" + text;
  }

  connectBtn.addEventListener("click", async () => {
    try {
      statusEl.textContent = "Suche nach Geräten...";

      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      log("Gerät gefunden: " + device.name);

      const server = await device.gatt.connect();
      log("Verbunden mit GATT-Server.");

      const service = await server.getPrimaryService(SERVICE_UUID);
      writeCharacteristic = await service.getCharacteristic(WRITE_CHARACTERISTIC_UUID);

      log("Bereit zum Senden von Befehlen.");
      sendBtn.disabled = false;

    } catch (error) {
      log("Fehler: " + error);
    }
  });

  sendBtn.addEventListener("click", async () => {
    try {
      // Platzhalter-Byte-Folge — wird später durch den echten
      // Anfahrhilfe-Befehl ersetzt, sobald wir ihn kennen.
      const testCommand = new Uint8Array([0x01]);
      await writeCharacteristic.writeValue(testCommand);
      log("Testbefehl gesendet: " + testCommand);
    } catch (error) {
      log("Fehler beim Senden: " + error);
    }
  });
</script>

</body>
</html>
