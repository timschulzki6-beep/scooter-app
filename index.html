<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninebot E3 Pro Tuning</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        button {
            font-size: 24px;
            padding: 20px 40px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            color: white;
            font-weight: bold;
        }
        #connectBtn { background: #00d2ff; }
        #speed25Btn { background: #f39c12; }
        #speed30Btn { background: #e74c3c; }
        #panicBtn { background: #2ecc71; }
        #log {
            margin-top: 20px;
            color: white;
            background: #2d2d44;
            padding: 15px;
            border-radius: 10px;
            width: 80%;
            max-width: 300px;
            min-height: 150px;
            font-size: 14px;
            overflow-y: auto;
        }
        h1 { color: white; }
    </style>
</head>
<body>
    <h1>⚡ Ninebot Tuning</h1>
    <button id="connectBtn">🔗 Verbinden mit Ninebot</button>
    <button id="speed25Btn">⚡ 25 km/h</button>
    <button id="speed30Btn">⚡ 30 km/h</button>
    <button id="panicBtn">🔙 Panic (20 km/h)</button>
    <div id="log">Bereit...</div>

    <script>
        let characteristic = null;

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += '<br>➜ ' + msg;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 🔗 Verbinden + Pairing (NinebotCrypto)
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                log('🔍 Suche nach Ninebot...');
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'N3E' }],
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });
                log('✅ Gefunden: ' + device.name);

                const server = await device.gatt.connect();
                log('✅ Verbunden!');

                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                log('✅ Service & Characteristic gefunden!');

                // 🔐 PAIRING (NinebotCrypto)
                log('⏳ Starte Pairing... (Power-Knopf drücken!)');

                // 1. Seriennummer anfordern
                const snCmd = new Uint8Array([0x3E, 0x21, 0x5B, 0x00]);
                await characteristic.writeValue(snCmd);
                const snResponse = await characteristic.readValue();
                const sn = new TextDecoder().decode(snResponse);
                log('📌 Seriennummer: ' + sn);

                // 2. Pairing-Request senden
                const pairCmd = new Uint8Array([0x3E, 0x21, 0x5C, 0x00, 0x01, 0x02, 0x03, 0x04]);
                await characteristic.writeValue(pairCmd);
                log('⏳ Warte auf Power-Knopf...');

                // 3. Auf Power-Knopf warten
                const pairResponse = await characteristic.readValue();
                const pairData = new Uint8Array(pairResponse);
                if (pairData[1] === 0x5D) {
                    log('✅ Pairing erfolgreich! Power-Knopf bestätigt.');
                } else {
                    log('❌ Pairing fehlgeschlagen. Versuche es nochmal.');
                }

                log('✅ Bereit für Geschwindigkeits-Befehle!');
            } catch (error) {
                log('❌ Fehler: ' + error);
            }
        });

        // ⚡ Geschwindigkeit setzen (finaler Befehl)
        async function setSpeed(kmh) {
            log('⚡ Setze auf ' + kmh + ' km/h...');
            if (!characteristic) {
                log('❌ Bitte zuerst verbinden!');
                return;
            }
            try {
                const speedCmd = new Uint8Array([0x5A, 0x01, 0x00, kmh]);
                await characteristic.writeValue(speedCmd);
                log('✅ Befehl für ' + kmh + ' km/h gesendet!');
            } catch (error) {
                log('❌ Fehler: ' + error);
            }
        }

        // 🎯 Buttons
        document.getElementById('speed25Btn').addEventListener('click', () => setSpeed(25));
        document.getElementById('speed30Btn').addEventListener('click', () => setSpeed(30));
        document.getElementById('panicBtn').addEventListener('click', () => setSpeed(20));
    </script>
</body>
</html>
